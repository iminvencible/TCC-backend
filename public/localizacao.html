<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrevClima - Ativar localizacao</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/location.js" defer></script>
</head>
<body class="auth-page">
  <main class="permission-card">
    <div class="location-art" aria-hidden="true">&#8982;</div>
    <h1>Ativar localizacao</h1>
    <p class="muted">Para receber alertas precisos da sua regiao, permita que o PrevClima acesse sua localizacao.</p>
    <p id="location-message" class="error" role="status"></p>
    <button id="allow-location" class="button" type="button">Permitir acesso a localizacao</button>
    <a class="guest-link" href="/inicio.html">Continuar sem localizacao exata</a>
  </main>
</body>
</html>
