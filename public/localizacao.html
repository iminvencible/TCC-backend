<head>
  <meta charset="utf-8">

<body class="auth-page">
  <main class="permission-card">
    <div class="location-art" aria-hidden="true">&#8982;</div>
    <h1>Ativar localização</h1>
    <p class="muted">Para receber alertas precisos da sua região, permita que o PrevClima use sua localização somente quando você solicitar.</p>
