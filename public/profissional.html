<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>PrevClima · Painel meteorológico</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/assets/css/console.css" />
    <link rel="stylesheet" href="/assets/css/console-app.css" />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin="anonymous"
      defer
    ></script>
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/console/app.js" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#page">Ir para o conteúdo</a>
    <div id="root" class="app">
      <aside class="side" aria-label="Menu principal">
        <a class="brand" href="#dashboard"
          ><span class="brand-symbol" aria-hidden="true">◉</span>
          <div>
            <div class="wordmark"><span>Prev</span><b>Clima</b></div>
            <small>Central meteorológica</small>
          </div></a
        >
        <nav id="nav" aria-label="Navegação do painel"></nav>
        <div class="side-foot">
          <div class="me">
            <span id="avatar" class="avatar"></span>
            <div>
              <strong id="identity-name">Carregando…</strong
              ><small id="identity-role"></small>
            </div>
          </div>
          <div class="side-tools">
            <button id="theme" class="icon-btn" aria-label="Alternar tema">
              ◐ Tema</button
            ><button id="logout" class="icon-btn">Sair ↗</button>
          </div>
          <a class="site-link" href="/inicio.html">Abrir site público ↗</a>
        </div>
      </aside>
      <button class="scrim" aria-label="Fechar menu"></button>
      <div class="main">
        <header class="top">
          <button id="menu" class="icon-btn menu-btn" aria-label="Abrir menu">
            ☰
          </button>
          <div class="ttl">
            <h1 id="page-title">Painel meteorológico</h1>
            <p id="page-sub">Situação atual das regiões monitoradas</p>
          </div>
          <span id="sync-status" class="sync">Consultando dados</span>
        </header>
        <p id="notice" role="status" class="notice" hidden></p>
        <main id="page" tabindex="-1">
          <p class="empty">Verificando sua sessão…</p>
        </main>
      </div>
    </div>
    <dialog id="editor" aria-label="Editor de alerta"></dialog>
  </body>
</html>
