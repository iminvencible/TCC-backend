<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrevClima - Entrar</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/login.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <header class="auth-brand">
      <span class="brand-mark" aria-hidden="true">&#9889;</span>
      <h1>Prev<span>Clima</span></h1>
      <p>Tecnologia a serviço da segurança climática</p>
    </header>
    <nav class="role-switch" aria-label="Tipo de acesso">
      <a class="active" href="/">Usuário</a>
      <a href="/meteorologista.html">Meteorologista</a>
    </nav>
    <section class="auth-card">
      <nav class="tabs" aria-label="Autenticação">
        <a class="active" href="/">Entrar</a>
        <a href="/cadastro.html">Criar conta</a>
      </nav>
      <form id="login-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <a class="helper" href="#" aria-disabled="true" title="Recurso em preparação">Esqueci minha senha</a>
        <p id="form-message" class="error" role="alert"></p>
        <button class="button" type="submit">Entrar na plataforma</button>
      </form>
    </section>
    <a class="guest-link" href="/inicio.html">Continuar como visitante</a>
    <a class="guest-link" href="/mobile/">Abrir aplicativo móvel</a>
  </main>
</body>
</html>
