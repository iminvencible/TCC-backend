<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrevClima - Enviar relato</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/report.js" defer></script>
</head>
<body>
  <header class="topbar"><a class="back-link" href="/perfil.html">&#8592;</a><strong>Relato de tempo</strong><span></span></header>
  <main class="app-shell narrow-shell">
    <section class="settings-panel report-panel">
      <div class="section-label">Nova ocorrencia</div>
      <p class="muted">Envie apenas observacoes feitas por voce. O relato sera revisado antes de qualquer publicacao.</p>
      <form id="report-form">
        <div class="field"><label for="description">O que aconteceu?</label><textarea id="description" minlength="10" maxlength="2000" required></textarea></div>
        <div class="field"><label for="occurred-at">Data e hora</label><input id="occurred-at" type="datetime-local" required></div>
        <div class="coordinate-grid">
          <div class="field"><label for="latitude">Latitude</label><input id="latitude" type="number" min="-90" max="90" step="any" required></div>
          <div class="field"><label for="longitude">Longitude</label><input id="longitude" type="number" min="-180" max="180" step="any" required></div>
        </div>
        <button id="use-location" class="button secondary" type="button">Usar minha localizacao atual</button>
        <div class="field"><label for="image-url">Link da imagem (opcional)</label><input id="image-url" type="url" maxlength="500" placeholder="https://..."></div>
        <p id="report-message" class="error" role="status"></p>
        <button class="button" type="submit">Enviar relato</button>
      </form>
    </section>
    <section><h2>Meus relatos</h2><div id="report-history" class="content-list"><p class="loading">Carregando...</p></div></section>
  </main>
  <nav class="bottom-nav" aria-label="Navegacao principal">
    <a href="/inicio.html">&#8962;<span>Inicio</span></a><a href="/alertas.html">!<span>Alertas</span></a><a class="nav-center" href="/inicio.html" aria-label="Previsao atual">&#9928;</a><a href="/mapa.html">&#9678;<span>Mapa</span></a><a class="active" href="/perfil.html">&#9679;<span>Perfil</span></a>
  </nav>
</body>
</html>
