<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PrevClima · Central meteorológica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<link rel="stylesheet" href="/assets/css/painel.css">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>

<!-- Logo: o servidor troca os marcadores pelo endereço de public/assets/img/logo.png (se existir).
     Sem logo, o painel mostra o logo reserva em SVG. -->
<script type="text/plain" id="logo-big">data:image/png;base64,__LOGO_BIG__</script>
<script type="text/plain" id="logo-small">data:image/png;base64,__LOGO_SMALL__</script>
<!-- Chave do MapTiler (variável MAPTILER_KEY do servidor; sem chave o mapa usa o OpenFreeMap). -->
<script type="text/plain" id="maptiler-key">__MAPTILER_KEY__</script>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/painel/painel.js"></script>
</body>
</html>
