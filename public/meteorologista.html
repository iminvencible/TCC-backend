<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrevClima - Acesso profissional</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/login.js" defer></script>
</head>
<body class="auth-page" data-professional="true">
  <main class="auth-shell">
    <aside class="auth-story" aria-label="Acesso profissional PrevClima">
      <span class="eyebrow">PREVCLIMA / CENTRAL DE OPERAÇÕES</span>
      <div class="auth-story-art" aria-hidden="true"><span class="story-orbit story-orbit-one"></span><span class="story-orbit story-orbit-two"></span><span class="story-core">&#9889;</span><span class="story-signal story-signal-one"></span><span class="story-signal story-signal-two"></span></div>
      <h2>Informação certa.<br><em>Na hora certa.</em></h2>
      <p>Emita avisos, acompanhe relatos e mantenha a comunidade informada.</p>
      <div class="auth-story-tags"><span>Avisos</span><span>Revisão</span><span>INMET</span></div>
    </aside>
    <div class="auth-form-column">
    <header class="auth-brand">
      <span class="brand-mark" aria-hidden="true">&#9889;</span>
      <h1>Prev<span>Clima</span></h1>
      <p>Acesso profissional</p>
    </header>
    <nav class="role-switch" aria-label="Tipo de acesso">
      <a href="/">Usuário</a>
      <a class="active" href="/meteorologista.html">Profissional</a>
    </nav>
    <p class="restricted-note">Contas de meteorologista são criadas pelo administrador.</p>
    <section class="auth-card">
      <form id="login-form">
        <div class="field">
          <label for="email">E-mail institucional</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="form-message" class="error" role="alert"></p>
        <button class="button" type="submit">Entrar como profissional</button>
      </form>
    </section>
    </div>
  </main>
</body>
</html>
