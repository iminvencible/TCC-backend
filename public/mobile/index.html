<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#063b91">
  <title>PrevClima Móvel</title>
  <link rel="manifest" href="/mobile/manifest.webmanifest">
  <link rel="icon" href="/mobile/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/mobile/mobile.css">
  <script src="/assets/js/api.js" defer></script>
  <script src="/mobile/mobile.js" defer></script>
</head>
<body class="mobile-auth">
  <main class="mobile-frame">
    <header class="mobile-brand">
      <span aria-hidden="true">⛈️</span>
      <h1>Prev<span>Clima</span></h1>
      <p>Segurança climática no seu celular</p>
    </header>
    <section class="mobile-card">
      <div class="mobile-tabs" role="tablist">
        <button id="show-login" class="active" type="button">Entrar</button>
        <button id="show-register" type="button">Criar conta</button>
      </div>
      <form id="mobile-login-form">
        <label>E-mail<input name="email" type="email" autocomplete="email" required></label>
        <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
        <p class="mobile-message" role="alert"></p>
        <button class="mobile-primary" type="submit">Entrar no aplicativo</button>
      </form>
      <form id="mobile-register-form" hidden>
        <label>Nome completo<input name="name" minlength="2" maxlength="120" autocomplete="name" required></label>
        <label>E-mail<input name="email" type="email" autocomplete="email" required></label>
        <label>Senha<input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label>
        <p class="mobile-helper">Use maiúscula, minúscula, número e símbolo.</p>
        <p class="mobile-message" role="alert"></p>
        <button class="mobile-primary" type="submit">Criar conta de usuário</button>
      </form>
    </section>
    <p class="mobile-note">Somente contas de usuário entram neste aplicativo. Meteorologistas e administradores usam o site.</p>
    <a class="mobile-site-link" href="/">Abrir versão do site</a>
  </main>
</body>
</html>
