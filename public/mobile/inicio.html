<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#063b91">
  <title>Início · PrevClima Móvel</title>
  <link rel="manifest" href="/mobile/manifest.webmanifest">
  <link rel="icon" href="/mobile/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/mobile/mobile.css">
  <script src="/assets/js/api.js" defer></script>
  <script src="/mobile/mobile-home.js" defer></script>
</head>
<body>
  <main class="mobile-frame mobile-dashboard">
    <header class="mobile-topbar">
      <div><small id="mobile-location">Localização</small><strong id="mobile-user">PrevClima</strong></div>
      <button id="mobile-logout" type="button" aria-label="Sair">Sair</button>
    </header>
    <section class="mobile-weather-card">
      <span class="mobile-weather-icon" aria-hidden="true">🌦️</span>
      <strong id="mobile-temperature">--°</strong>
      <p id="mobile-condition">Carregando previsão...</p>
      <div class="mobile-metrics">
        <span><small>Umidade</small><strong id="mobile-humidity">--</strong></span>
        <span><small>Vento</small><strong id="mobile-wind">--</strong></span>
        <span><small>Chuva</small><strong id="mobile-rain">--</strong></span>
      </div>
      <small id="mobile-source" class="mobile-source"></small>
    </section>
    <section class="mobile-risk-card">
      <span aria-hidden="true">⚠️</span>
      <div><strong id="mobile-risk-title">Verificando avisos</strong><p id="mobile-risk-copy">Aguarde alguns instantes.</p></div>
    </section>
    <section class="mobile-section">
      <header><h2>Avisos ativos</h2><a href="/alertas.html">Ver todos</a></header>
      <div id="mobile-alerts" class="mobile-alert-list"><p>Carregando...</p></div>
    </section>
    <nav class="mobile-bottom-nav" aria-label="Navegação do aplicativo">
      <a class="active" href="/mobile/inicio.html">⌂<span>Início</span></a>
      <a href="/alertas.html">⚠<span>Avisos</span></a>
      <a href="/mapa.html">⌖<span>Mapa</span></a>
      <a href="/perfil.html">●<span>Perfil</span></a>
    </nav>
  </main>
</body>
</html>
