name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: ruff format --check app migrations tests
      - run: ruff check app migrations tests
      - run: pytest -q
      - name: Check browser JavaScript
        run: find public -name '*.js' -print0 | xargs -0 -n1 node --check

  mysql-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: prevclima
          MYSQL_USER: prevclima
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://prevclima:test-password@127.0.0.1:3306/prevclima?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: python -m app.seed
      - run: alembic check
